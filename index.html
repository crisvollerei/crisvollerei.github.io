<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>清蒸排班表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'qingzheng': {
              'orange': '#f0883e',
              'blue': '#58a6ff',
              'purple': '#a371f7',
              'green': '#3fb950',
              'dark': '#0d1117',
              'card': '#161b22',
              'cell': '#21262d',
              'border': '#30363d',
              'text': '#e6edf3',
              'muted': '#7d8590'
            }
          },
          fontFamily: {
            'sans': ['Noto Sans SC', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      /* Dark Theme (Default) */
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-cell: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #f0883e;
      --accent-glow: rgba(240, 136, 62, 0.15);
      --day-color: #58a6ff;
      --night-color: #a371f7;
      --rest-color: #3fb950;
      --noon-color: #d29922;
      --morning-color: #39d2c0;
      --evening-color: #f778ba;
      --today-bg: rgba(240, 136, 62, 0.08);
      --today-border: #f0883e;
      --avatar-bg: linear-gradient(135deg, #f0883e, #a371f7);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      --glass-bg: rgba(22, 27, 34, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);

      /* Shift-based background colors */
      --shift-bg-day: #0f172a;
      --shift-bg-night: #1e1b4b;
      --shift-bg-rest: #1a2e1a;
      --shift-bg-noon: #2d2410;
      --shift-bg-morning: #0f2d2a;
      --shift-bg-evening: #2d1525;

      /* Shift cell tints (dark) */
      --cell-day-bg: rgba(88, 166, 255, 0.1);
      --cell-day-border: rgba(88, 166, 255, 0.2);
      --cell-night-bg: rgba(163, 113, 247, 0.1);
      --cell-night-border: rgba(163, 113, 247, 0.2);
      --cell-rest-bg: rgba(63, 185, 80, 0.08);
      --cell-rest-border: rgba(63, 185, 80, 0.15);
      --cell-noon-bg: rgba(210, 153, 34, 0.1);
      --cell-noon-border: rgba(210, 153, 34, 0.2);
      --cell-morning-bg: rgba(57, 210, 192, 0.1);
      --cell-morning-border: rgba(57, 210, 192, 0.2);
      --cell-evening-bg: rgba(247, 119, 186, 0.1);
      --cell-evening-border: rgba(247, 119, 186, 0.2);

      /* Current week highlight */
      --current-week-bg: rgba(240, 136, 62, 0.04);

      /* Tooltip */
      --tooltip-bg: rgba(13, 17, 23, 0.95);
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --bg-card: #ffffff;
      --bg-cell: #f3f4f6;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #d55f0a;
      --accent-glow: rgba(213, 95, 10, 0.12);
      --day-color: #0969da;
      --night-color: #8250df;
      --rest-color: #1a7f37;
      --noon-color: #9a6700;
      --morning-color: #0d9488;
      --evening-color: #c44569;
      --today-bg: rgba(213, 95, 10, 0.08);
      --today-border: #d55f0a;
      --avatar-bg: linear-gradient(135deg, #d55f0a, #8250df);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(0, 0, 0, 0.1);

      /* Light theme shift backgrounds */
      --shift-bg-day: #e0f2fe;
      --shift-bg-night: #ede9fe;
      --shift-bg-rest: #dcfce7;
      --shift-bg-noon: #fef3c7;
      --shift-bg-morning: #ccfbf1;
      --shift-bg-evening: #fce7f3;

      /* Shift cell tints (light) */
      --cell-day-bg: rgba(9, 105, 218, 0.08);
      --cell-day-border: rgba(9, 105, 218, 0.15);
      --cell-night-bg: rgba(130, 80, 223, 0.08);
      --cell-night-border: rgba(130, 80, 223, 0.15);
      --cell-rest-bg: rgba(26, 127, 55, 0.07);
      --cell-rest-border: rgba(26, 127, 55, 0.12);
      --cell-noon-bg: rgba(154, 103, 0, 0.08);
      --cell-noon-border: rgba(154, 103, 0, 0.15);
      --cell-morning-bg: rgba(13, 148, 136, 0.08);
      --cell-morning-border: rgba(13, 148, 136, 0.15);
      --cell-evening-bg: rgba(196, 69, 105, 0.08);
      --cell-evening-border: rgba(196, 69, 105, 0.15);

      --current-week-bg: rgba(213, 95, 10, 0.04);

      --tooltip-bg: rgba(255, 255, 255, 0.95);
    }

    [data-shift="day"] { background: linear-gradient(135deg, var(--shift-bg-day), var(--bg)); }
    [data-shift="night"] { background: linear-gradient(135deg, var(--shift-bg-night), var(--bg)); }
    [data-shift="rest"] { background: linear-gradient(135deg, var(--shift-bg-rest), var(--bg)); }
    [data-shift="noon"] { background: linear-gradient(135deg, var(--shift-bg-noon), var(--bg)); }
    [data-shift="morning"] { background: linear-gradient(135deg, var(--shift-bg-morning), var(--bg)); }
    [data-shift="evening"] { background: linear-gradient(135deg, var(--shift-bg-evening), var(--bg)); }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 120px;
      transition: background 0.5s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, var(--accent-glow) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(88, 166, 255, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse 50% 30% at 20% 80%, rgba(163, 113, 247, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* ===== Glassmorphism Effect ===== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-md);
    }

    /* ===== Theme Toggle ===== */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
    }

    .theme-toggle:hover {
      transform: scale(1.1) rotate(15deg);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .theme-toggle:active {
      transform: scale(0.95);
    }

    /* ===== Back to Today Button ===== */
    .back-to-today {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
    }

    .back-to-today:hover {
      transform: scale(1.1) translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .back-to-today:active {
      transform: scale(0.95);
    }

    /* ===== Main Container ===== */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeInDown 0.6s ease-out;
    }

    .avatar-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      padding: 6px 16px 6px 8px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .avatar-badge:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--avatar-bg);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
      border-radius: 50%;
    }

    .avatar-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background: var(--avatar-bg);
      z-index: 1;
      border-radius: 50%;
    }

    .badge-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .badge-text strong {
      color: var(--accent);
      font-weight: 600;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
    }

    .slogan {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      opacity: 0.7;
      font-style: italic;
      min-height: 1.2em;
    }

    /* ===== Legend ===== */
    .legend {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      animation: fadeIn 0.8s ease-out;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 100px;
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
    }

    .legend-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    .legend-dot.day { background: var(--day-color); color: var(--day-color); }
    .legend-dot.night { background: var(--night-color); color: var(--night-color); }
    .legend-dot.rest { background: var(--rest-color); color: var(--rest-color); }
    .legend-dot.noon { background: var(--noon-color); color: var(--noon-color); }
    .legend-dot.morning { background: var(--morning-color); color: var(--morning-color); }
    .legend-dot.evening { background: var(--evening-color); color: var(--evening-color); }

    /* ===== Content Layout ===== */
    .content-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ===== Today Card ===== */
    .today-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.6s ease-out;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
    }

    .today-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .today-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--day-color), var(--noon-color), var(--night-color), var(--rest-color));
      border-radius: 24px 24px 0 0;
    }

    .today-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0.3;
      pointer-events: none;
    }

    .today-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .today-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .today-shift {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .today-shift.day { color: var(--day-color); text-shadow: 0 0 20px rgba(88, 166, 255, 0.3); }
    .today-shift.night { color: var(--night-color); text-shadow: 0 0 20px rgba(163, 113, 247, 0.3); }
    .today-shift.rest { color: var(--rest-color); text-shadow: 0 0 20px rgba(63, 185, 80, 0.3); }
    .today-shift.noon { color: var(--noon-color); text-shadow: 0 0 20px rgba(210, 153, 34, 0.3); }
    .today-shift.morning { color: var(--morning-color); text-shadow: 0 0 20px rgba(57, 210, 192, 0.3); }
    .today-shift.evening { color: var(--evening-color); text-shadow: 0 0 20px rgba(247, 119, 186, 0.3); }

    .today-shift-emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
    }

    .today-cycle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .today-cycle span {
      color: var(--accent);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ===== Cycle Progress ===== */
    .cycle-progress {
      width: 100%;
      height: 6px;
      background: var(--bg-cell);
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--day-color), var(--noon-color), var(--night-color), var(--rest-color));
      border-radius: 3px;
      transition: width 0.5s ease;
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
      animation: shimmer 2s infinite;
    }

    /* ===== Next Shift Info ===== */
    .next-shift-info {
      background: var(--bg-cell);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .next-shift-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .next-shift-item:last-child {
      margin-bottom: 0;
    }

    .next-shift-day { color: var(--day-color); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .next-shift-night { color: var(--night-color); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .next-shift-rest { color: var(--rest-color); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .next-shift-noon { color: var(--noon-color); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .next-shift-morning { color: var(--morning-color); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .next-shift-evening { color: var(--evening-color); font-weight: 600; font-family: 'JetBrains Mono', monospace; }

    /* ===== Rest countdown ===== */
    .rest-countdown {
      background: var(--bg-cell);
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rest-countdown-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--rest-color);
    }

    /* ===== Live Clock & Countdown ===== */
    .live-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin: 12px 0 8px;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }

    .countdown-container {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
      padding: 8px 0;
      border-top: 1px dashed var(--border);
      position: relative;
      z-index: 1;
    }

    .countdown-item {
      text-align: center;
    }

    .countdown-label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .countdown-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    /* ===== Statistics Cards ===== */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      animation: fadeIn 0.8s ease-out;
    }

    .stat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--stat-color, var(--accent));
    }

    .stat-card.day { --stat-color: var(--day-color); }
    .stat-card.night { --stat-color: var(--night-color); }
    .stat-card.rest { --stat-color: var(--rest-color); }
    .stat-card.noon { --stat-color: var(--noon-color); }
    .stat-card.morning { --stat-color: var(--morning-color); }
    .stat-card.evening { --stat-color: var(--evening-color); }

    .stat-icon {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--stat-color, var(--accent));
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-trend {
      font-size: 11px;
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-trend.up { color: var(--rest-color); }
    .stat-trend.down { color: #f87171; }
    .stat-trend.same { color: var(--text-muted); }

    /* ===== Ring Chart ===== */
    .ring-chart-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      position: relative;
      z-index: 1;
    }
    .ring-chart {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .ring-chart-inner {
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      background: var(--glass-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .ring-legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
      max-height: 80px;
      overflow-y: auto;
    }
    .ring-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ring-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ===== Work hours card ===== */
    .work-hours-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.8s ease-out;
      transition: all 0.3s ease;
    }
    .work-hours-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .work-hours-label {
      font-size: 12px;
      color: var(--text-muted);
    }
    .work-hours-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    .work-hours-unit {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 2px;
    }

    /* ===== Year Heatmap ===== */
    .heatmap-container {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      animation: fadeIn 0.8s ease-out 0.2s both;
      transition: all 0.3s ease;
    }
    .heatmap-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: center;
    }
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 10px;
    }
    .heatmap-month {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 8px 4px 6px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .heatmap-month:hover {
      background: var(--bg-cell);
    }
    .heatmap-month.current-month {
      background: var(--today-bg);
      outline: 1.5px solid var(--accent);
    }
    .heatmap-month-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .heatmap-month.current-month .heatmap-month-label {
      color: var(--accent);
    }
    .mini-cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1.5px;
      margin-bottom: 1px;
    }
    .mini-cal-wd {
      width: 10px;
      text-align: center;
      font-size: 6px;
      color: var(--text-muted);
      opacity: 0.5;
      line-height: 1;
    }
    .mini-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1.5px;
    }
    .mini-cal-day {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      transition: transform 0.15s ease;
    }
    .mini-cal-day:hover {
      transform: scale(1.6);
      z-index: 2;
    }
    .mini-cal-day.shift-day { background: var(--day-color); opacity: 0.7; }
    .mini-cal-day.shift-night { background: var(--night-color); opacity: 0.7; }
    .mini-cal-day.shift-rest { background: var(--rest-color); opacity: 0.35; }
    .mini-cal-day.shift-noon { background: var(--noon-color); opacity: 0.7; }
    .mini-cal-day.shift-morning { background: var(--morning-color); opacity: 0.7; }
    .mini-cal-day.shift-evening { background: var(--evening-color); opacity: 0.7; }
    .mini-cal-day.empty { background: transparent; }
    .mini-cal-day.today-marker {
      outline: 1.5px solid var(--accent);
      outline-offset: 0.5px;
      opacity: 1;
    }

    /* ===== Calendar Section ===== */
    .calendar-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ===== Month Nav ===== */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-btn {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .nav-btn:hover {
      background: var(--bg-cell);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .nav-btn:active { transform: scale(0.95); }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .nav-btn:disabled:hover {
      background: var(--glass-bg);
      border-color: var(--glass-border);
      color: var(--text);
      transform: none;
    }

    .month-title {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      flex: 1;
      cursor: pointer;
      border-radius: 8px;
      padding: 4px 12px;
      transition: all 0.2s ease;
    }

    .month-title:hover {
      background: var(--bg-cell);
      color: var(--accent);
    }

    /* ===== Calendar Grid ===== */
    .calendar {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 12px 8px 4px;
      border-bottom: 1px solid var(--border);
    }

    .weekday {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .weekday.weekend { color: var(--night-color); }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 8px;
      gap: 4px;
    }

    .day-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      min-height: 44px;
    }

    .day-cell.empty { background: transparent; cursor: default; }

    .day-cell.past { color: var(--text-muted); opacity: 0.5; }

    .day-cell:not(.past):not(.today):not(.empty) { cursor: pointer; }

    /* Shift-based cell backgrounds */
    .day-cell.shift-day { background: var(--cell-day-bg); border: 1px solid var(--cell-day-border); }
    .day-cell.shift-night { background: var(--cell-night-bg); border: 1px solid var(--cell-night-border); }
    .day-cell.shift-rest { background: var(--cell-rest-bg); border: 1px solid var(--cell-rest-border); }
    .day-cell.shift-noon { background: var(--cell-noon-bg); border: 1px solid var(--cell-noon-border); }
    .day-cell.shift-morning { background: var(--cell-morning-bg); border: 1px solid var(--cell-morning-border); }
    .day-cell.shift-evening { background: var(--cell-evening-bg); border: 1px solid var(--cell-evening-border); }

    .day-cell:not(.past):not(.today):not(.empty):hover {
      transform: scale(1.08);
      box-shadow: var(--shadow-sm);
      z-index: 2;
    }
    .day-cell.shift-day:hover { border-color: var(--day-color); }
    .day-cell.shift-night:hover { border-color: var(--night-color); }
    .day-cell.shift-rest:hover { border-color: var(--rest-color); }
    .day-cell.shift-noon:hover { border-color: var(--noon-color); }
    .day-cell.shift-morning:hover { border-color: var(--morning-color); }
    .day-cell.shift-evening:hover { border-color: var(--evening-color); }

    .day-cell.today {
      background: var(--today-bg) !important;
      border: 1.5px solid var(--today-border) !important;
      box-shadow: 0 0 16px var(--accent-glow);
      animation: pulse-border 2s ease-in-out infinite;
    }

    :root {
      --selected-color: #22d3ee;
      --selected-glow: rgba(34, 211, 238, 0.2);
    }
    [data-theme="light"] {
      --selected-color: #0891b2;
      --selected-glow: rgba(8, 145, 178, 0.15);
    }
    .day-cell.selected:not(.today) {
      border: 1.5px solid var(--selected-color) !important;
      box-shadow: 0 0 10px var(--selected-glow);
    }
    .day-cell.selected:not(.today) .day-num {
      color: var(--selected-color);
      font-weight: 700;
    }

    .mini-cal-day.selected-day {
      outline: 1.5px solid var(--selected-color);
      outline-offset: 0.5px;
      opacity: 1;
    }

    .day-cell .day-num { line-height: 1; }

    .day-cell .shift-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px currentColor;
    }

    .shift-dot.day { background: var(--day-color); color: var(--day-color); }
    .shift-dot.night { background: var(--night-color); color: var(--night-color); }
    .shift-dot.rest { background: var(--rest-color); color: var(--rest-color); }
    .shift-dot.noon { background: var(--noon-color); color: var(--noon-color); }
    .shift-dot.morning { background: var(--morning-color); color: var(--morning-color); }
    .shift-dot.evening { background: var(--evening-color); color: var(--evening-color); }

    .day-cell.today .day-num { color: var(--accent); }

    .day-cell.current-week { box-shadow: inset 0 0 0 1px var(--current-week-bg); }

    .day-cell.animate-in { animation: cellSlideUp 0.35s ease-out both; }

    @keyframes cellSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Festival Marker ===== */
    .festival-marker {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      color: var(--accent);
      font-weight: bold;
    }

    /* ===== Lunar Date ===== */
    .lunar-date {
      font-size: 9px;
      color: var(--text-muted);
      line-height: 1;
    }

    .lunar-date.solar-term {
      color: #ff6b6b;
      font-weight: 600;
    }

    /* ===== Holiday Badge ===== */
    .holiday-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: linear-gradient(135deg, #ff6b6b, #ff8e53);
      color: white;
      font-size: 7px;
      padding: 1px 4px;
      border-radius: 6px;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(255, 107, 107, 0.3);
    }

    /* ===== Cell Tooltip ===== */
    .cell-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--tooltip-bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--glass-border);
      z-index: 50;
      pointer-events: none;
    }
    .cell-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--tooltip-bg);
    }
    .day-cell:hover .cell-tooltip { display: block; }

    /* ===== Detail Panel ===== */
    .detail-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      display: none;
      animation: slideUp 0.3s ease-out;
      box-shadow: var(--shadow-md);
    }

    .detail-panel.show { display: block; }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .detail-date {
      font-size: 14px;
      font-weight: 600;
    }

    .detail-panel { margin-top: 20px; }

    .detail-close {
      background: var(--bg-cell);
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .detail-close:hover { background: var(--border); color: var(--text); }

    .detail-shift {
      font-size: 36px;
      font-weight: 900;
      text-align: center;
      padding: 16px 0;
    }

    .detail-shift.day { color: var(--day-color); }
    .detail-shift.night { color: var(--night-color); }
    .detail-shift.rest { color: var(--rest-color); }
    .detail-shift.noon { color: var(--noon-color); }
    .detail-shift.morning { color: var(--morning-color); }
    .detail-shift.evening { color: var(--evening-color); }

    .detail-cycle {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .detail-cycle span { color: var(--accent); font-weight: 600; font-family: 'JetBrains Mono', monospace; }

    .detail-extra {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .detail-extra-item {
      background: var(--bg-cell);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .detail-extra-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .detail-extra-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    /* ===== Year-Month Picker Modal ===== */
    .picker-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .picker-overlay.show { display: flex; }
    .picker-content {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      width: 90%;
      max-width: 320px;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .picker-year-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .picker-year-label { font-size: 18px; font-weight: 700; }
    .picker-year-btn {
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .picker-year-btn:hover { border-color: var(--accent); color: var(--accent); }
    .picker-months {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .picker-month-btn {
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      text-align: center;
    }
    .picker-month-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--today-bg);
    }
    .picker-month-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* ===== Settings Modal ===== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show { display: flex; }

    .modal-content {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      width: 90%;
      max-width: 460px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title { font-size: 18px; font-weight: 600; }

    .modal-close {
      background: var(--bg-cell);
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover { background: var(--border); color: var(--text); }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      resize: vertical;
      min-height: 80px;
      transition: all 0.2s;
    }

    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Shift def row in settings */
    .shift-def-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg-cell);
      border-radius: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      border: 1px solid var(--border);
    }

    .shift-def-name {
      font-weight: 600;
      font-size: 14px;
      min-width: 50px;
      flex-shrink: 0;
    }

    .shift-def-time {
      width: 72px;
      padding: 6px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-align: center;
    }

    .shift-def-time:focus {
      outline: none;
      border-color: var(--accent);
    }

    .shift-def-check {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .shift-def-check input {
      width: auto;
      cursor: pointer;
    }

    .shift-def-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .settings-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin: 20px 0 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn-secondary {
      background: var(--bg-cell);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    .btn-sm {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      flex: none;
    }

    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm.danger:hover { border-color: #f87171; color: #f87171; }

    /* ===== Animations ===== */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 12px var(--accent-glow); }
      50% { box-shadow: 0 0 22px rgba(240, 136, 62, 0.3); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9); }

      const saved = localStorage.getItem('qingzheng-shift-defs');

          const parsed = JSON.parse(saved);
          // 深度合并：保存的数据覆盖默认值，但保留默认中没有被删除的
          const merged = JSON.parse(JSON.stringify(DEFAULT_SHIFT_DEFS));
          for (const [k, v] of Object.entries(parsed)) {

          }
          return merged;
        } catch(e) { /* fall through */ }
      }

    function getLunarDate(date) {
      const baseDate = new Date(1900, 0, 31);
      let offset = Math.floor((date - baseDate) / 86400000);
      let i, leap = 0, temp = 0, yearCyl, isLeap = false;
      for (i = 1900; i < 2101 && offset > 0; i++) { temp = lYearDays(i); offset -= temp; }
      if (offset < 0) { offset += temp; i--; }
      const lunarYear = i;
      yearCyl = i - 1900 + 36;
      leap = leapMonth(i);
      for (i = 1; i < 13 && offset > 0; i++) {
        if (leap > 0 && i === (leap + 1) && isLeap === false) { --i; isLeap = true; temp = leapDays(lunarYear); }
        else { temp = monthDays(lunarYear, i); }
        if (isLeap === true && i === (leap + 1)) isLeap = false;
        offset -= temp;
      }
      if (offset === 0 && leap > 0 && i === leap + 1) { if (isLeap) { isLeap = false; } else { isLeap = true; --i; } }
      if (offset < 0) { offset += temp; --i; }
      const lunarMonth = i, lunarDay = offset + 1;
      return { year: lunarYear, month: lunarMonth, day: lunarDay, isLeap: isLeap, yearGanZhi: cyclical(yearCyl), zodiac: Animals[(yearCyl - 4) % 12], monthStr: (isLeap ? '闰' : '') + LunarMonths[lunarMonth - 1] + '月', dayStr: LunarDays[lunarDay - 1] };
    }
    function lYearDays(y) { let i, sum = 348; for (i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0; return sum + leapDays(y); }
    function leapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
    function leapDays(y) { if (leapMonth(y)) return (LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29; return 0; }
    function monthDays(y, m) { return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
    function cyclical(num) { return Gan[num % 10] + Zhi[num % 12]; }

    function getSolarTerm(date) {
      const year = date.getFullYear();
      const dateStr = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      const termDates = SOLAR_TERM_DATES[year] || SOLAR_TERM_DATES[2026];
      const termIndex = termDates.indexOf(dateStr);
      return termIndex !== -1 ? SOLAR_TERMS[termIndex] : null;
    }

    function getCycleIndex(date) {
      const diff = Math.round((date - ANCHOR_DATE) / (1000 * 60 * 60 * 24));

    function getShift(date) { return CYCLE[getCycleIndex(date)]; }

    // ===== 班次时间计算 (基于 SHIFT_DEFS) =====
    function getShiftTimes(date) {
      const shift = getShift(date);
      const def = getShiftDef(shift);
      if (!def.isWork || !def.startTime || !def.endTime) return null;
      const year = date.getFullYear(), month = date.getMonth(), day = date.getDate();
      const [sh, sm] = def.startTime.split(':').map(Number);
      const [eh, em] = def.endTime.split(':').map(Number);
      const start = new Date(year, month, day, sh, sm, 0);
      let end;
      if (isCrossDayShift(shift)) {
        end = new Date(year, month, day + 1, eh, em, 0);
      } else {
        end = new Date(year, month, day, eh, em, 0);
      }
      return { start, end };
    }

    // 获取当前有效班次（考虑跨日）
    function getEffectiveShiftInfo() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayShift = getShift(yesterday);

      // 检查昨天的跨日班次是否仍有效
      if (isCrossDayShift(yesterdayShift)) {
        const def = getShiftDef(yesterdayShift);
        const [eh, em] = def.endTime.split(':').map(Number);
        const crossEnd = new Date(today.getFullYear(), today.getMonth(), today.getDate(), eh, em, 0);
        if (now < crossEnd) {
          const [sh, sm] = def.startTime.split(':').map(Number);
          const crossStart = new Date(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate(), sh, sm, 0);
          return { shift: yesterdayShift, isCrossDay: true, start: crossStart, end: crossEnd };
        }
      }

      const todayShift = getShift(today);
      const times = getShiftTimes(today);
      return { shift: todayShift, isCrossDay: false, start: times ? times.start : null, end: times ? times.end : null };
    }

    function formatCountdown(ms) {
      if (ms <= 0) return '00:00:00';
      const totalSeconds = Math.floor(ms / 1000);
      return `${String(Math.floor(totalSeconds / 3600)).padStart(2, '0')}:${String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0')}:${String(totalSeconds % 60).padStart(2, '0')}`;
    }

    function getNextWorkCountdown(now) {
      for (let i = 0; i < 14; i++) {
        const checkDate = new Date(now);
        checkDate.setDate(checkDate.getDate() + i);
        const shift = getShift(checkDate);
        if (isWorkShift(shift)) {
          const times = getShiftTimes(checkDate);
          if (times && times.start > now) return times.start - now;
        }
      }
      return null;
    }

    function getDaysToNextRest() {

      return -1;

      for (const s of CYCLE) {
        if (!seen.has(s)) { seen.add(s); result.push(s); }
      }
      return result;
    }

      }
      return result;

    function getWeekdayCn(date) { return ['周日','周一','周二','周三','周四','周五','周六'][date.getDay()]; }

    function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
    function isToday(date) { return isSameDay(date, new Date()); }
    function isPast(date) { const today = new Date(); today.setHours(0,0,0,0); return date < today; }

    // 动态计算所有工作班次的下一个出现天数
    function calculateNextShifts() {
      const today = new Date();
      today.setHours(0,0,0,0);
      const workShifts = getWorkShifts();
      const result = {};
      for (const ws of workShifts) result[ws] = -1;

      for (let i = 1; i <= 30; i++) {
        const futureDate = new Date(today);
        futureDate.setDate(futureDate.getDate() + i);
        const s = getShift(futureDate);
        if (result[s] === -1) result[s] = i;
        if (Object.values(result).every(v => v !== -1)) break;
      }
      return result;
    }

    // 动态统计本月各类型班次数量
    function calculateMonthlyStats(year, month) {
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const counts = {};
      for (let d = 1; d <= daysInMonth; d++) {
        const s = getShift(new Date(year, month, d));
        counts[s] = (counts[s] || 0) + 1;
      }
      return counts;
    }

    function getConsecutiveShiftDays(date) {
      const shift = getShift(date);
      let count = 1;
      for (let i = 1; i <= 60; i++) {
        const prev = new Date(date); prev.setDate(prev.getDate() - i);
        if (getShift(prev) === shift) count++; else break;
      }
      return count;
    }

    function getDaysToWeekend(date) {
      for (let i = 0; i <= 14; i++) {
        const check = new Date(date); check.setDate(check.getDate() + i);
        if (isRestShift(getShift(check))) return i;
      }
      return -1;
    }

      const stats = calculateMonthlyStats(year, month);

      for (const [shiftName, count] of Object.entries(stats)) {

          total += count * getShiftDurationHours(shiftName);

        const sdef = getShiftDef(sn);
        const pct = ((stats[sn] || 0) / totalDays) * 100;
        gradientStr += `${sdef.cssClass === 'day' ? 'var(--day-color)' : sdef.cssClass === 'night' ? 'var(--night-color)' : sdef.cssClass === 'rest' ? 'var(--rest-color)' : sdef.cssClass === 'noon' ? 'var(--noon-color)' : sdef.cssClass === 'morning' ? 'var(--morning-color)' : sdef.cssClass === 'evening' ? 'var(--evening-color)' : 'var(--rest-color)'} ${cumulativePct}% ${cumulativePct + pct}%, `;
        cumulativePct += pct;
      }
      gradientStr = gradientStr.replace(/,\s*$/, '');
      document.getElementById('ringChart').style.background = `conic-gradient(${gradientStr})`;
      const workPct = ((Object.entries(stats).reduce((sum, [sn, cnt]) => sum + (isWorkShift(sn) ? cnt : 0), 0)) / totalDays) * 100;
      document.getElementById('ringChartInner').textContent = `${Math.round(workPct)}%`;

      // Ring legend
      const ringLegend = document.getElementById('ringLegend');
      ringLegend.innerHTML = '';
      for (const sn of uniqueShifts) {
        const sdef = getShiftDef(sn);
        const item = mk('div', { cls: 'ring-legend-item' });
        const dot = mk('div', { cls: 'ring-legend-dot', html: '' });
        dot.style.background = `var(--${sdef.cssClass}-color)`;
        const label = mk('span', { text: `${sn} ${stats[sn] || 0}天` });
        item.appendChild(dot); item.appendChild(label);
        ringLegend.appendChild(item);
      }

      // Legend
      renderLegend();

      // Footer hint
      const cycleNames = getUniqueShiftsInCycle();
      document.getElementById('footerHint').innerHTML = `💡 点击任意日期可查看详情<br>周期：${cycleNames.join(' ')}`;

      // Month title
      document.getElementById('monthTitle').textContent = `${viewYear}年${viewMonth+1}月`;

      // Nav buttons
      const today2 = new Date();
      document.getElementById('prevBtn').disabled = (viewYear === today2.getFullYear() - 1 && viewMonth === 0);
      document.getElementById('nextBtn').disabled = (viewYear === today2.getFullYear() + 1 && viewMonth === 11);

      // Calendar grid
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';
      const firstDay = new Date(viewYear, viewMonth, 1);
      const startDow = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const todayOfWeek = today.getDay();
      const todayMonday = new Date(today);
      todayMonday.setDate(today.getDate() - ((todayOfWeek + 6) % 7));
      const todaySunday = new Date(todayMonday);
      todaySunday.setDate(todayMonday.getDate() + 6);

      for (let i = 0; i < startDow; i++) grid.appendChild(mk('div', { cls: 'day-cell empty' }));

      let cellIndex = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(viewYear, viewMonth, d);
        const s = getShift(date);
        const sdef = getShiftDef(s);
        const shiftCls = `shift-${sdef.cssClass}`;
        const past = isPast(date) && !isToday(date);
        const todayCls = isToday(date) ? ' today' : '';
        const pastCls = past ? ' past' : '';
        let weekCls = '';
        if (date >= todayMonday && date <= todaySunday && viewMonth === today.getMonth() && viewYear === today.getFullYear()) {
          weekCls = ' current-week';
        }
        const cell = mk('div', { cls: `day-cell ${shiftCls}${todayCls}${pastCls}${weekCls} animate-in`, onclick: () => showDetail(date) });
        if (selectedDate && isSameDay(date, selectedDate)) cell.classList.add('selected');
        cell.style.animationDelay = `${cellIndex * 20}ms`;

        const tooltip = mk('div', { cls: 'cell-tooltip', text: s });
        cell.appendChild(tooltip);

        const holiday = getHoliday(date);
        if (holiday) { const hb = mk('div', { cls: 'holiday-badge', text: holiday.substring(0, 2) }); cell.appendChild(hb); }

        const dotEl = mk('div', { cls: `shift-dot ${sdef.cssClass}` });
        const numEl = mk('div', { cls: 'day-num', text: d });

        const lunarD = getLunarDate(date);
        const term = getSolarTerm(date);
        let lunarText = '', lunarClass = 'lunar-date';
        if (term) { const ti = SOLAR_TERM_INFO[term]; lunarText = `${ti.icon}${term}`; lunarClass = 'lunar-date solar-term'; }
        else if (lunarD.day === 1) lunarText = lunarD.monthStr;
        else lunarText = lunarD.dayStr;
        const lunarEl = mk('div', { cls: lunarClass, text: lunarText });

        cell.appendChild(dotEl); cell.appendChild(numEl); cell.appendChild(lunarEl);
        grid.appendChild(cell);
        cellIndex++;
      }

      renderHeatmap();
      updateLiveClockAndCountdown();
    }

    // ===== Legend (dynamic) =====
    function renderLegend() {
      const container = document.getElementById('legendContainer');
      const uniqueShifts = getUniqueShiftsInCycle();
      container.innerHTML = '';
      for (const sn of uniqueShifts) {
        const sdef = getShiftDef(sn);
        const item = mk('div', { cls: 'legend-item' });
        const dot = mk('div', { cls: `legend-dot ${sdef.cssClass}` });
        const label = mk('span', { text: sn });
        if (sdef.isWork && sdef.startTime && sdef.endTime) {
          label.textContent = `${sn} (${sdef.startTime}-${sdef.endTime}${isCrossDayShift(sn) ? '次日' : ''})`;
        }
        item.appendChild(dot); item.appendChild(label);
        container.appendChild(item);
      }
    }

    // ===== Year Heatmap =====
    function renderHeatmap() {
      const grid = document.getElementById('heatmapGrid');
      grid.innerHTML = '';
      const today = new Date();
      const weekdays = ['一','二','三','四','五','六','日'];
      for (let m = 0; m < 12; m++) {
        const isCurrent = (viewYear === today.getFullYear() && m === today.getMonth());
        const daysInMonth = new Date(viewYear, m + 1, 0).getDate();
        const firstDow = (new Date(viewYear, m, 1).getDay() + 6) % 7;
        const monthDiv = mk('div', { cls: 'heatmap-month' + (isCurrent ? ' current-month' : '') });
        const wdRow = mk('div', { cls: 'mini-cal-weekdays' });
        for (let w = 0; w < 7; w++) { const wd = mk('div', { cls: 'mini-cal-wd', text: weekdays[w] }); wdRow.appendChild(wd); }
        monthDiv.appendChild(wdRow);
        const calGrid = mk('div', { cls: 'mini-cal-grid' });
        for (let i = 0; i < firstDow; i++) calGrid.appendChild(mk('div', { cls: 'mini-cal-day empty' }));
        for (let d = 1; d <= daysInMonth; d++) {
          const date = new Date(viewYear, m, d);
          const shift = getShift(date);
          const sdef = getShiftDef(shift);
          const shiftCls = `shift-${sdef.cssClass}`;
          const isTodayCell = isToday(date);
          const isSelectedCell = selectedDate && isSameDay(date, selectedDate);
          const dayEl = mk('div', { cls: 'mini-cal-day ' + shiftCls + (isTodayCell ? ' today-marker' : '') + (isSelectedCell ? ' selected-day' : '') });
          dayEl.title = `${m+1}月${d}日 · ${shift}`;
          dayEl.style.cursor = 'pointer';
          dayEl.addEventListener('click', (e) => { e.stopPropagation(); selectedDate = date; viewMonth = m; render(); showDetail(date); });
          calGrid.appendChild(dayEl);
        }
        monthDiv.appendChild(calGrid);
        const label = mk('div', { cls: 'heatmap-month-label', text: `${m+1}月` });
        monthDiv.appendChild(label);
        monthDiv.addEventListener('click', () => { viewMonth = m; closeDetail(); render(); });
        grid.appendChild(monthDiv);
      }
    }

    function mk(tag, opts) {
      const el = document.createElement(tag);
      if (opts.cls) el.className = opts.cls;
      if (opts.text !== undefined) el.textContent = opts.text;
      if (opts.onclick) el.onclick = opts.onclick;
      if (opts.html) el.innerHTML = opts.html;
      return el;
    }

    // ===== Detail Panel =====
    function showDetail(date) {
      const s = getShift(date);
      const sdef = getShiftDef(s);
      const panel = document.getElementById('detailPanel');
      let dateInfo = formatDate(date) + ' ' + getWeekdayCn(date);
      const lunar = getLunarDate(date);
      dateInfo += ` 农历${lunar.yearGanZhi}年[${lunar.zodiac}]${lunar.monthStr}${lunar.dayStr}`;
      const solarTerm = getSolarTerm(date);
      if (solarTerm) { const ti = SOLAR_TERM_INFO[solarTerm]; dateInfo += ` ${ti.icon}${solarTerm}`; }
      const holiday = getHoliday(date);
      if (holiday) dateInfo += ` 🎉${holiday}`;
      document.getElementById('detailDate').textContent = dateInfo;
      const ds = document.getElementById('detailShift');
      ds.innerHTML = `${sdef.emoji} ${s}`;
      ds.className = `detail-shift ${sdef.cssClass}`;
      document.getElementById('detailCycle').textContent = getCycleIndex(date) + 1;

      const extraEl = document.getElementById('detailExtra');
      extraEl.innerHTML = '';
      const consecutive = getConsecutiveShiftDays(date);
      extraEl.appendChild(mkDetailItem('连续同班', `${consecutive}天`));
      const workHrs = calculateWorkHours(date.getFullYear(), date.getMonth());
      extraEl.appendChild(mkDetailItem('本月工时', `${workHrs}h`));
      const daysToRest = getDaysToWeekend(date);
      extraEl.appendChild(mkDetailItem('距休息日', daysToRest === 0 ? '今天' : `${daysToRest}天`));
      const cyclePos = getCycleIndex(date) + 1;
      extraEl.appendChild(mkDetailItem('周期位置', `${cyclePos}/${CYCLE.length}`));

      panel.classList.add('show');
      if (window.innerWidth < 769) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      selectedDate = date;
      document.querySelectorAll('.day-cell.selected').forEach(el => el.classList.remove('selected'));
      document.querySelectorAll('.day-cell').forEach(el => {
        const numEl = el.querySelector('.day-num');
        if (numEl && !el.classList.contains('empty')) {
          const day = parseInt(numEl.textContent);
          if (day === date.getDate() && viewMonth === date.getMonth() && viewYear === date.getFullYear()) {
            el.classList.add('selected');
          }
        }
      });
      renderHeatmap();
    }

    function mkDetailItem(label, value) {
      const div = mk('div', { cls: 'detail-extra-item' });
      div.appendChild(mk('div', { cls: 'detail-extra-label', text: label }));
      div.appendChild(mk('div', { cls: 'detail-extra-value', text: value }));
      return div;
    }

    function closeDetail() {
      document.getElementById('detailPanel').classList.remove('show');
      document.querySelectorAll('.day-cell.selected').forEach(el => el.classList.remove('selected'));
      selectedDate = null;
    }

    // ===== Year-Month Picker =====
    let pickerYear;
    function openPicker() { pickerYear = viewYear; renderPicker(); document.getElementById('pickerModal').classList.add('show'); }
    function closePicker() { document.getElementById('pickerModal').classList.remove('show'); }
    function renderPicker() {
      const today = new Date();
      document.getElementById('pickerYearLabel').textContent = `${pickerYear}年`;
      const monthsGrid = document.getElementById('pickerMonths');
      monthsGrid.innerHTML = '';
      for (let m = 0; m < 12; m++) {
        const btn = mk('button', { cls: 'picker-month-btn', text: `${m + 1}月` });
        if (m === viewMonth && pickerYear === viewYear) btn.classList.add('active');
        btn.addEventListener('click', () => { viewYear = pickerYear; viewMonth = m; closePicker(); closeDetail(); render(); });
        monthsGrid.appendChild(btn);
      }
    }
    function pickerPrevYear() { const today = new Date(); if (pickerYear > today.getFullYear() - 1) { pickerYear--; renderPicker(); } }
    function pickerNextYear() { const today = new Date(); if (pickerYear < today.getFullYear() + 1) { pickerYear++; renderPicker(); } }

    // ===== Month Navigation =====
    function prevMonth() { if (viewMonth === 0) { viewYear--; viewMonth = 11; } else viewMonth--; closeDetail(); render(); }
    function nextMonth() { if (viewMonth === 11) { viewYear++; viewMonth = 0; } else viewMonth++; closeDetail(); render(); }

    // ===== Back to Today =====
    document.getElementById('backToToday').addEventListener('click', () => {
      const today = new Date();
      viewYear = today.getFullYear(); viewMonth = today.getMonth();
      closeDetail(); render();
    });

    // ===== Keyboard =====
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevMonth(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); nextMonth(); }
      else if (e.key === 't' || e.key === 'T') { e.preventDefault(); const today = new Date(); viewYear = today.getFullYear(); viewMonth = today.getMonth(); closeDetail(); render(); }
      else if (e.key === 'Escape') {
        if (document.getElementById('pickerModal').classList.contains('show')) closePicker();
        else if (document.getElementById('settingsModal').classList.contains('show')) closeSettings();
        else if (document.getElementById('detailPanel').classList.contains('show')) closeDetail();
      }
    });

    // ===== Settings =====
    function openSettings() {
      document.getElementById('settingsModal').classList.add('show');
      document.getElementById('anchorDate').value = formatDateISO(ANCHOR_DATE);
      document.getElementById('cyclePattern').value = CYCLE.join(' ');
      renderShiftDefsEditor();
    }

    function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }

    // 渲染班次定义编辑器
    function renderShiftDefsEditor() {
      const container = document.getElementById('shiftDefsEditor');
      container.innerHTML = '';
      // 获取周期中的班次 + 已定义的班次
      const allShiftNames = new Set([...CYCLE, ...Object.keys(SHIFT_DEFS)]);

      for (const sn of allShiftNames) {
        const def = SHIFT_DEFS[sn] || getShiftDef(sn);
        const row = mk('div', { cls: 'shift-def-row' });
        row.innerHTML = `
          <span class="shift-def-name">${def.emoji} ${sn}</span>
          <span class="shift-def-label">预设:</span>
          <select class="shift-def-preset" data-shift="${sn}" style="width:80px;font-size:12px;padding:6px 4px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);">
            ${CSS_PRESETS.map(p => `<option value="${p}" ${def.cssClass === p ? 'selected' : ''}>${PRESET_ICONS[p]} ${p}</option>`).join('')}
          </select>
          <span class="shift-def-label">上班:</span>
          <input type="time" class="shift-def-time" data-shift="${sn}" data-field="startTime" value="${def.startTime || ''}" ${!def.isWork ? 'disabled' : ''}>
          <span class="shift-def-label">下班:</span>
          <input type="time" class="shift-def-time" data-shift="${sn}" data-field="endTime" value="${def.endTime || ''}" ${!def.isWork ? 'disabled' : ''}>
          <label class="shift-def-check">
            <input type="checkbox" data-shift="${sn}" data-field="isWork" ${def.isWork ? 'checked' : ''} onchange="toggleShiftWork(this)">
            工作
          </label>
          <label class="shift-def-check">
            <input type="checkbox" data-shift="${sn}" data-field="crossDay" ${def.crossDay ? 'checked' : ''} ${!def.isWork ? 'disabled' : ''}>
            跨日
          </label>
          <button class="btn-sm danger" onclick="removeShiftDef('${sn}')" title="删除此班次定义" style="margin-left:auto;">✕</button>
        `;
        container.appendChild(row);
      }
    }

    // 切换工作时间输入框启用/禁用
    function toggleShiftWork(checkbox) {
      const shiftName = checkbox.dataset.shift;
      const row = checkbox.closest('.shift-def-row');
      const timeInputs = row.querySelectorAll('.shift-def-time');
      const crossCheck = row.querySelector('[data-field="crossDay"]');
      timeInputs.forEach(ti => ti.disabled = !checkbox.checked);
      if (crossCheck) crossCheck.disabled = !checkbox.checked;
    }

    // 添加新班次
    function addShiftDef() {
      const name = prompt('请输入新班次名称（如：早班、值班等）:');
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      if (SHIFT_DEFS[trimmed]) { alert('该班次已存在！'); return; }
      SHIFT_DEFS[trimmed] = { emoji: '📋', cssClass: 'day', startTime: '09:00', endTime: '17:00', isWork: true };
      renderShiftDefsEditor();
    }

    // 删除班次定义
    function removeShiftDef(shiftName) {
      if (!confirm(`确定要删除"${shiftName}"的班次定义吗？`)) return;
      // 同时从周期中移除
      CYCLE = CYCLE.filter(s => s !== shiftName);
      delete SHIFT_DEFS[shiftName];
      document.getElementById('cyclePattern').value = CYCLE.join(' ');
      renderShiftDefsEditor();
    }

    function saveSettings() {
      const anchorVal = document.getElementById('anchorDate').value;
      const cycleRaw = document.getElementById('cyclePattern').value;
      const newCycle = cycleRaw.split(/\s+/).filter(s => s.trim() !== '');

      if (newCycle.length === 0) { alert('周期模式不能为空！'); return; }
      if (!anchorVal) { alert('请选择锚定日期！'); return; }
      const parts = anchorVal.split('-');
      if (parts.length !== 3 || isNaN(parts[0]) || isNaN(parts[1]) || isNaN(parts[2])) { alert('日期格式无效！'); return; }
      const newAnchor = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      if (isNaN(newAnchor.getTime())) { alert('无效的日期！'); return; }

      // 从编辑器读取班次定义
      const editorRows = document.querySelectorAll('.shift-def-row');
      const newDefs = {};
      for (const row of editorRows) {
        const shiftName = row.querySelector('[data-shift]').dataset.shift;
        const presetEl = row.querySelector('.shift-def-preset');
        const cssClass = presetEl ? presetEl.value : 'day';
        const startEl = row.querySelector('[data-field="startTime"]');
        const endEl = row.querySelector('[data-field="endTime"]');
        const workEl = row.querySelector('[data-field="isWork"]');
        const crossEl = row.querySelector('[data-field="crossDay"]');

        const isWork = workEl ? workEl.checked : true;
        const existingDef = SHIFT_DEFS[shiftName];
        const emoji = existingDef ? existingDef.emoji : (PRESET_ICONS[cssClass] || '📋');

        newDefs[shiftName] = {
          emoji: emoji,
          cssClass: cssClass,
          startTime: isWork && startEl ? startEl.value : null,
          endTime: isWork && endEl ? endEl.value : null,
          isWork: isWork
        };
        if (crossEl && crossEl.checked) newDefs[shiftName].crossDay = true;
      }

      // 确保周期中的每个班次都有定义
      for (const sn of newCycle) {
        if (!newDefs[sn]) {
          newDefs[sn] = { emoji: '📋', cssClass: 'day', startTime: '09:00', endTime: '17:00', isWork: true };
        }
      }

      ANCHOR_DATE = newAnchor;
      CYCLE = newCycle;
      SHIFT_DEFS = newDefs;

      localStorage.setItem('qingzheng-anchor', anchorVal);
      localStorage.setItem('qingzheng-cycle', JSON.stringify(CYCLE));
      saveShiftDefs();

      // 同步到原生存储
      if (typeof Android !== 'undefined') {
        Android.saveSettings(JSON.stringify(CYCLE), anchorVal, JSON.stringify(SHIFT_DEFS));
      }

      closeSettings();
      render();
    }

    // ===== Resize handler =====
    let resizeTimer;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => render(), 250); });
  </script>
</body>
</html>
