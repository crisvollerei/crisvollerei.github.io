<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>清蒸排班表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'qingzheng': {
              'orange': '#f0883e',
              'blue': '#58a6ff',
              'purple': '#a371f7',
              'green': '#3fb950',
              'dark': '#0d1117',
              'card': '#161b22',
              'cell': '#21262d',
              'border': '#30363d',
              'text': '#e6edf3',
              'muted': '#7d8590'
            }
          },
          fontFamily: {
            'sans': ['Noto Sans SC', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      /* Dark Theme (Default) */
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-cell: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #f0883e;
      --accent-glow: rgba(240, 136, 62, 0.15);
      --day-color: #58a6ff;
      --night-color: #a371f7;
      --rest-color: #3fb950;
      --today-bg: rgba(240, 136, 62, 0.08);
      --today-border: #f0883e;
      --avatar-bg: linear-gradient(135deg, #f0883e, #a371f7);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      --glass-bg: rgba(22, 27, 34, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);

      /* Shift-based background colors */
      --shift-bg-day: #0f172a;
      --shift-bg-night: #1e1b4b;
      --shift-bg-rest: #1a2e1a;

      /* Shift cell tints (dark) */
      --cell-day-bg: rgba(88, 166, 255, 0.1);
      --cell-day-border: rgba(88, 166, 255, 0.2);
      --cell-night-bg: rgba(163, 113, 247, 0.1);
      --cell-night-border: rgba(163, 113, 247, 0.2);
      --cell-rest-bg: rgba(63, 185, 80, 0.08);
      --cell-rest-border: rgba(63, 185, 80, 0.15);

      /* Current week highlight */
      --current-week-bg: rgba(240, 136, 62, 0.04);

      /* Tooltip */
      --tooltip-bg: rgba(13, 17, 23, 0.95);
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --bg-card: #ffffff;
      --bg-cell: #f3f4f6;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #d55f0a;
      --accent-glow: rgba(213, 95, 10, 0.12);
      --day-color: #0969da;
      --night-color: #8250df;
      --rest-color: #1a7f37;
      --today-bg: rgba(213, 95, 10, 0.08);
      --today-border: #d55f0a;
      --avatar-bg: linear-gradient(135deg, #d55f0a, #8250df);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(0, 0, 0, 0.1);

      /* Light theme shift backgrounds */
      --shift-bg-day: #e0f2fe;
      --shift-bg-night: #ede9fe;
      --shift-bg-rest: #dcfce7;

      /* Shift cell tints (light) */
      --cell-day-bg: rgba(9, 105, 218, 0.08);
      --cell-day-border: rgba(9, 105, 218, 0.15);
      --cell-night-bg: rgba(130, 80, 223, 0.08);
      --cell-night-border: rgba(130, 80, 223, 0.15);
      --cell-rest-bg: rgba(26, 127, 55, 0.07);
      --cell-rest-border: rgba(26, 127, 55, 0.12);

      --current-week-bg: rgba(213, 95, 10, 0.04);

      --tooltip-bg: rgba(255, 255, 255, 0.95);
    }

    [data-shift="day"] { background: linear-gradient(135deg, var(--shift-bg-day), var(--bg)); }
    [data-shift="night"] { background: linear-gradient(135deg, var(--shift-bg-night), var(--bg)); }
    [data-shift="rest"] { background: linear-gradient(135deg, var(--shift-bg-rest), var(--bg)); }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 120px;
      transition: background 0.5s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, var(--accent-glow) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(88, 166, 255, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse 50% 30% at 20% 80%, rgba(163, 113, 247, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* ===== Glassmorphism Effect ===== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-md);
    }

    /* ===== Theme Toggle ===== */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
    }

    .theme-toggle:hover {
      transform: scale(1.1) rotate(15deg);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .theme-toggle:active {
      transform: scale(0.95);
    }

    /* ===== Back to Today Button ===== */
    .back-to-today {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
    }

    .back-to-today:hover {
      transform: scale(1.1) translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .back-to-today:active {
      transform: scale(0.95);
    }

    /* ===== Main Container ===== */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeInDown 0.6s ease-out;
    }

    .avatar-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      padding: 6px 16px 6px 8px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .avatar-badge:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--avatar-bg);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
      border-radius: 50%;
    }

    .avatar-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background: var(--avatar-bg);
      z-index: 1;
      border-radius: 50%;
    }

    .badge-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .badge-text strong {
      color: var(--accent);
      font-weight: 600;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
    }

    .slogan {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      opacity: 0.7;
      font-style: italic;
      min-height: 1.2em;
    }

    /* ===== Legend ===== */
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      animation: fadeIn 0.8s ease-out;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 100px;
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
    }

    .legend-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    .legend-dot.day { background: var(--day-color); color: var(--day-color); }
    .legend-dot.night { background: var(--night-color); color: var(--night-color); }
    .legend-dot.rest { background: var(--rest-color); color: var(--rest-color); }

    /* ===== Content Layout ===== */
    .content-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ===== Today Card ===== */
    .today-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.6s ease-out;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
    }

    .today-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .today-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--day-color), var(--night-color), var(--rest-color));
      border-radius: 24px 24px 0 0;
    }

    .today-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0.3;
      pointer-events: none;
    }

    .today-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .today-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .today-shift {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .today-shift.day {
      color: var(--day-color);
      text-shadow: 0 0 20px rgba(88, 166, 255, 0.3);
    }
    .today-shift.night {
      color: var(--night-color);
      text-shadow: 0 0 20px rgba(163, 113, 247, 0.3);
    }
    .today-shift.rest {
      color: var(--rest-color);
      text-shadow: 0 0 20px rgba(63, 185, 80, 0.3);
    }

    .today-shift-emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
    }

    .today-cycle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .today-cycle span {
      color: var(--accent);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ===== Cycle Progress ===== */
    .cycle-progress {
      width: 100%;
      height: 6px;
      background: var(--bg-cell);
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--day-color), var(--night-color), var(--rest-color));
      border-radius: 3px;
      transition: width 0.5s ease;
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
      animation: shimmer 2s infinite;
    }

    /* ===== Next Shift Info ===== */
    .next-shift-info {
      background: var(--bg-cell);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .next-shift-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .next-shift-item:last-child {
      margin-bottom: 0;
    }

    .next-shift-day { color: var(--day-color); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .next-shift-night { color: var(--night-color); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .next-shift-rest { color: var(--rest-color); font-weight: 600; font-family: 'JetBrains Mono', monospace; }

    /* ===== Rest countdown (days to next rest) ===== */
    .rest-countdown {
      background: var(--bg-cell);
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rest-countdown-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--rest-color);
    }

    /* ===== 实时时钟与倒计时 ===== */
    .live-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin: 12px 0 8px;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }

    .countdown-container {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
      padding: 8px 0;
      border-top: 1px dashed var(--border);
      position: relative;
      z-index: 1;
    }

    .countdown-item {
      text-align: center;
    }

    .countdown-label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .countdown-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    /* ===== Statistics Cards ===== */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      animation: fadeIn 0.8s ease-out;
    }

    .stat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--stat-color, var(--accent));
    }

    .stat-card.day { --stat-color: var(--day-color); }
    .stat-card.night { --stat-color: var(--night-color); }
    .stat-card.rest { --stat-color: var(--rest-color); }

    .stat-icon {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--stat-color, var(--accent));
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-trend {
      font-size: 11px;
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-trend.up { color: var(--rest-color); }
    .stat-trend.down { color: #f87171; }
    .stat-trend.same { color: var(--text-muted); }

    /* ===== Ring Chart ===== */
    .ring-chart-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      position: relative;
      z-index: 1;
    }
    .ring-chart {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .ring-chart-inner {
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      background: var(--glass-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .ring-legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .ring-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ring-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ===== Work hours card ===== */
    .work-hours-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.8s ease-out;
      transition: all 0.3s ease;
    }
    .work-hours-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .work-hours-label {
      font-size: 12px;
      color: var(--text-muted);
    }
    .work-hours-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    .work-hours-unit {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 2px;
    }

    /* ===== Year Heatmap (Mini Calendars) ===== */
    .heatmap-container {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      animation: fadeIn 0.8s ease-out 0.2s both;
      transition: all 0.3s ease;
    }
    .heatmap-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: center;
    }
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 10px;
    }
    .heatmap-month {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 8px 4px 6px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .heatmap-month:hover {
      background: var(--bg-cell);
    }
    .heatmap-month.current-month {
      background: var(--today-bg);
      outline: 1.5px solid var(--accent);
    }
    .heatmap-month-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .heatmap-month.current-month .heatmap-month-label {
      color: var(--accent);
    }
    .mini-cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1.5px;
      margin-bottom: 1px;
    }
    .mini-cal-wd {
      width: 10px;
      text-align: center;
      font-size: 6px;
      color: var(--text-muted);
      opacity: 0.5;
      line-height: 1;
    }
    .mini-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1.5px;
    }
    .mini-cal-day {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      transition: transform 0.15s ease;
    }
    .mini-cal-day:hover {
      transform: scale(1.6);
      z-index: 2;
    }
    .mini-cal-day.shift-day {
      background: var(--day-color);
      opacity: 0.7;
    }
    .mini-cal-day.shift-night {
      background: var(--night-color);
      opacity: 0.7;
    }
    .mini-cal-day.shift-rest {
      background: var(--rest-color);
      opacity: 0.35;
    }
    .mini-cal-day.empty {
      background: transparent;
    }
    .mini-cal-day.today-marker {
      outline: 1.5px solid var(--accent);
      outline-offset: 0.5px;
      opacity: 1;
    }

    /* ===== Calendar Section ===== */
    .calendar-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ===== Month Nav ===== */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-btn {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .nav-btn:hover {
      background: var(--bg-cell);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .nav-btn:disabled:hover {
      background: var(--glass-bg);
      border-color: var(--glass-border);
      color: var(--text);
      transform: none;
    }

    .month-title {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      flex: 1;
      cursor: pointer;
      border-radius: 8px;
      padding: 4px 12px;
      transition: all 0.2s ease;
    }

    .month-title:hover {
      background: var(--bg-cell);
      color: var(--accent);
    }

    /* ===== Calendar Grid ===== */
    .calendar {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 12px 8px 4px;
      border-bottom: 1px solid var(--border);
    }

    .weekday {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .weekday.weekend { color: var(--night-color); }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 8px;
      gap: 4px;
    }

    .day-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      min-height: 44px;
    }

    .day-cell.empty {
      background: transparent;
      cursor: default;
    }

    .day-cell.past {
      color: var(--text-muted);
      opacity: 0.5;
    }

    .day-cell:not(.past):not(.today):not(.empty) {
      cursor: pointer;
    }

    /* Shift-based cell backgrounds */
    .day-cell.shift-day {
      background: var(--cell-day-bg);
      border: 1px solid var(--cell-day-border);
    }
    .day-cell.shift-night {
      background: var(--cell-night-bg);
      border: 1px solid var(--cell-night-border);
    }
    .day-cell.shift-rest {
      background: var(--cell-rest-bg);
      border: 1px solid var(--cell-rest-border);
    }

    .day-cell:not(.past):not(.today):not(.empty):hover {
      transform: scale(1.08);
      box-shadow: var(--shadow-sm);
      z-index: 2;
    }
    .day-cell.shift-day:hover { border-color: var(--day-color); }
    .day-cell.shift-night:hover { border-color: var(--night-color); }
    .day-cell.shift-rest:hover { border-color: var(--rest-color); }

    .day-cell.today {
      background: var(--today-bg) !important;
      border: 1.5px solid var(--today-border) !important;
      box-shadow: 0 0 16px var(--accent-glow);
      animation: pulse-border 2s ease-in-out infinite;
    }

    /* ===== Selected date marker ===== */
    :root {
      --selected-color: #22d3ee;
      --selected-glow: rgba(34, 211, 238, 0.2);
    }
    [data-theme="light"] {
      --selected-color: #0891b2;
      --selected-glow: rgba(8, 145, 178, 0.15);
    }
    .day-cell.selected:not(.today) {
      border: 1.5px solid var(--selected-color) !important;
      box-shadow: 0 0 10px var(--selected-glow);
    }
    .day-cell.selected:not(.today) .day-num {
      color: var(--selected-color);
      font-weight: 700;
    }

    /* Mini calendar selected marker */
    .mini-cal-day.selected-day {
      outline: 1.5px solid var(--selected-color);
      outline-offset: 0.5px;
      opacity: 1;
    }

    .day-cell .day-num {
      line-height: 1;
    }

    .day-cell .shift-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px currentColor;
    }

    .shift-dot.day { background: var(--day-color); color: var(--day-color); }
    .shift-dot.night { background: var(--night-color); color: var(--night-color); }
    .shift-dot.rest { background: var(--rest-color); color: var(--rest-color); }

    .day-cell.today .day-num {
      color: var(--accent);
    }

    /* Current week highlight */
    .day-cell.current-week {
      box-shadow: inset 0 0 0 1px var(--current-week-bg);
    }
    .week-row {
      background: var(--current-week-bg);
      border-radius: 12px;
    }

    /* ===== Stagger animation for calendar cells ===== */
    .day-cell.animate-in {
      animation: cellSlideUp 0.35s ease-out both;
    }

    @keyframes cellSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Festival Marker ===== */
    .festival-marker {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      color: var(--accent);
      font-weight: bold;
    }

    /* ===== Lunar Date ===== */
    .lunar-date {
      font-size: 9px;
      color: var(--text-muted);
      line-height: 1;
    }

    .lunar-date.solar-term {
      color: #ff6b6b;
      font-weight: 600;
    }

    /* ===== Holiday Badge ===== */
    .holiday-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: linear-gradient(135deg, #ff6b6b, #ff8e53);
      color: white;
      font-size: 7px;
      padding: 1px 4px;
      border-radius: 6px;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(255, 107, 107, 0.3);
    }

    /* ===== Cell Tooltip ===== */
    .cell-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--tooltip-bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--glass-border);
      z-index: 50;
      pointer-events: none;
    }
    .cell-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--tooltip-bg);
    }
    .day-cell:hover .cell-tooltip {
      display: block;
    }

    /* ===== Solar Term Icon ===== */
    .solar-term-icon {
      font-size: 10px;
      margin-right: 1px;
    }

    /* ===== Detail Panel ===== */
    .detail-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      display: none;
      animation: slideUp 0.3s ease-out;
      box-shadow: var(--shadow-md);
    }

    .detail-panel.show { display: block; }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .detail-date {
      font-size: 14px;
      font-weight: 600;
    }

    .detail-panel {
      margin-top: 20px;
    }

    .detail-close {
      background: var(--bg-cell);
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .detail-close:hover { background: var(--border); color: var(--text); }

    .detail-shift {
      font-size: 36px;
      font-weight: 900;
      text-align: center;
      padding: 16px 0;
    }

    .detail-shift.day { color: var(--day-color); }
    .detail-shift.night { color: var(--night-color); }
    .detail-shift.rest { color: var(--rest-color); }

    .detail-cycle {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .detail-cycle span { color: var(--accent); font-weight: 600; font-family: 'JetBrains Mono', monospace; }

    /* Extra info grid in detail panel */
    .detail-extra {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .detail-extra-item {
      background: var(--bg-cell);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .detail-extra-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .detail-extra-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    /* ===== Year-Month Picker Modal ===== */
    .picker-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .picker-overlay.show { display: flex; }
    .picker-content {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      width: 90%;
      max-width: 320px;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .picker-year-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .picker-year-label {
      font-size: 18px;
      font-weight: 700;
    }
    .picker-year-btn {
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .picker-year-btn:hover { border-color: var(--accent); color: var(--accent); }
    .picker-months {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .picker-month-btn {
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      text-align: center;
    }
    .picker-month-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--today-bg);
    }
    .picker-month-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* ===== Settings Modal ===== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show { display: flex; }

    .modal-content {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
    }

    .modal-close {
      background: var(--bg-cell);
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover { background: var(--border); color: var(--text); }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      resize: vertical;
      min-height: 100px;
      transition: all 0.2s;
    }

    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn-secondary {
      background: var(--bg-cell);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    /* ===== Animations ===== */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 12px var(--accent-glow); }
      50% { box-shadow: 0 0 22px rgba(240, 136, 62, 0.3); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ===== Footer ===== */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .footer-hint {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: inline-block;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
    }

    .settings-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      color: var(--text-muted);
    }

    .settings-btn:hover {
      background: var(--bg-cell);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* ===== Keyboard shortcut hint ===== */
    .kbd-hint {
      font-size: 10px;
      color: var(--text-muted);
      opacity: 0.5;
      margin-top: 8px;
    }
    .kbd-hint kbd {
      display: inline-block;
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      margin: 0 2px;
    }

    /* ===== Responsive - Tablet ===== */
    @media (min-width: 481px) and (max-width: 768px) {
      .today-card { max-width: 440px; margin: 0 auto 32px; }
      .stats-container { max-width: 440px; margin: 0 auto 32px; }
      .calendar { max-width: 440px; margin: 0 auto; }
      .day-cell { min-height: 52px; }
      .lunar-date { font-size: 10px; }
    }

    /* ===== Responsive - Desktop (Wide Screen) ===== */
    @media (min-width: 769px) {
      body { padding: 40px 24px 120px; }

      .main-container {
        max-width: 1200px;
      }

      .content-layout {
        flex-direction: row;
        align-items: flex-start;
        gap: 32px;
      }

      .left-column {
        flex: 0 0 380px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .right-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .today-card {
        margin: 0;
      }

      .stats-container {
        margin: 0;
      }

      .calendar {
        max-width: none;
      }

      .day-cell { min-height: 60px; }
      .lunar-date { font-size: 11px; }

      .detail-panel {
        position: sticky;
        top: 20px;
      }
    }

    /* ===== Responsive - Large Desktop ===== */
    @media (min-width: 1200px) {
      .left-column {
        flex: 0 0 420px;
      }

      .day-cell { min-height: 70px; }
      .lunar-date { font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="themeToggle" title="切换主题 (快捷键: 无)">
    <i class="fas fa-moon" id="themeIcon"></i>
  </button>

  <!-- Back to Today Button -->
  <button class="back-to-today" id="backToToday" title="回到今天 (快捷键: T)">
    <i class="fas fa-calendar-day"></i>
  </button>

  <div class="main-container">
    <!-- Header -->
    <div class="header">
      <div class="avatar-badge">
        <div class="avatar">
          <img src="avatar.png" alt="清蒸" onerror="this.style.display='none'">
          <div class="avatar-fallback">清</div>
        </div>
        <span class="badge-text"><strong>清蒸</strong> 的排班表</span>
      </div>
      <h1>清蒸排班</h1>
      <div class="subtitle" id="subtitle"></div>
      <div class="slogan" id="slogan"></div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item"><div class="legend-dot day"></div>白班</div>
      <div class="legend-item"><div class="legend-dot night"></div>夜班</div>
      <div class="legend-item"><div class="legend-dot rest"></div>休息</div>
    </div>

    <!-- Content Layout -->
    <div class="content-layout">
      <!-- Left Column (Today Info & Stats) -->
      <div class="left-column">
        <!-- Today Card -->
        <div class="today-card">
          <div class="today-label">今日班次</div>
          <div class="today-date" id="todayDate"></div>
          <div class="today-shift" id="todayShift"></div>
          <div class="today-cycle">本周期第 <span id="todayCycle"></span> 天</div>

          <!-- Cycle Progress Bar -->
          <div class="cycle-progress">
            <div class="progress-bar" id="progressBar"></div>
          </div>

          <!-- Next Shift Info -->
          <div class="next-shift-info">

    const Zhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const Animals = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
    const LunarMonths = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
    const LunarDays = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
                      '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
                      '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

    // 计算农历日期
    function getLunarDate(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const day = date.getDate();

      const baseDate = new Date(1900, 0, 31);
      let offset = Math.floor((date - baseDate) / 86400000);

      let i, leap = 0, temp = 0;
      let yearCyl, monCyl, dayCyl;
      let baseYear = 1900;
      let baseMonth = 1;
      let baseDay = 31;

      for (i = baseYear; i < 2101 && offset > 0; i++) {
        temp = lYearDays(i);
        offset -= temp;
      }
      if (offset < 0) {
        offset += temp;
        i--;
      }

      const lunarYear = i;
      yearCyl = i - 1900 + 36;

      leap = leapMonth(i);
      let isLeap = false;

      for (i = 1; i < 13 && offset > 0; i++) {
        if (leap > 0 && i === (leap + 1) && isLeap === false) {
          --i;
          isLeap = true;
          temp = leapDays(lunarYear);
        } else {
          temp = monthDays(lunarYear, i);
        }

        if (isLeap === true && i === (leap + 1)) isLeap = false;
        offset -= temp;
      }

      if (offset === 0 && leap > 0 && i === leap + 1) {
        if (isLeap) {
          isLeap = false;
        } else {
          isLeap = true;
          --i;
        }
      }

      if (offset < 0) {
        offset += temp;
        --i;
      }

      const lunarMonth = i;
      monCyl = (yearCyl - 1) * 12 + i + 13;
      const lunarDay = offset + 1;
      dayCyl = offset + 40;

      return {
        year: lunarYear,
        month: lunarMonth,
        day: lunarDay,
        isLeap: isLeap,
        yearGanZhi: cyclical(yearCyl),
        zodiac: Animals[(yearCyl - 4) % 12],
        monthStr: (isLeap ? '闰' : '') + LunarMonths[lunarMonth - 1] + '月',
        dayStr: LunarDays[lunarDay - 1]
      };
    }

    function lYearDays(y) {
      let i, sum = 348;
      for (i = 0x8000; i > 0x8; i >>= 1) {
        sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
      }
      return sum + leapDays(y);
    }

    function leapMonth(y) {
      return LUNAR_INFO[y - 1900] & 0xf;
    }

    function leapDays(y) {
      if (leapMonth(y)) {
        return ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29);
      } else {
        return 0;
      }
    }

    function monthDays(y, m) {
      return ((LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29);
    }

    function cyclical(num) {
      return Gan[num % 10] + Zhi[num % 12];
    }

    // 获取二十四节气
    function getSolarTerm(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const dateStr = `${month}-${day}`;

      // 查找对应的节气
      const termDates = SOLAR_TERM_DATES[year] || SOLAR_TERM_DATES[2026];
      const termIndex = termDates.indexOf(dateStr);

      if (termIndex !== -1) {
        return SOLAR_TERMS[termIndex];
      }
      return null;
    }

    // 获取节假日
    function getHoliday(date) {
      const dateStr = formatDateISO(date);
      return HOLIDAYS[dateStr] || null;
    }

    // ===== Theme =====
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const savedTheme = localStorage.getItem('qingzheng-theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeIcon.className = savedTheme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
    }

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('qingzheng-theme', next);
      themeIcon.className = next === 'light' ? 'fas fa-sun' : 'fas fa-moon';
    });

    // ===== State =====
    let viewYear, viewMonth;
    let selectedDate = null;

    // ===== Init =====
    (function init() {
      const today = new Date();
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();

      // Set random slogan
      document.getElementById('slogan').textContent = SLOGANS[Math.floor(Math.random() * SLOGANS.length)];

      render();
      // 默认选中今日，展示详情面板
      showDetail(today);
      // 启动实时时钟更新
      setInterval(updateLiveClockAndCountdown, 1000);
    })();

    function getCycleIndex(date) {
      const diff = Math.round((date - ANCHOR_DATE) / (1000 * 60 * 60 * 24));
      return ((diff % CYCLE.length) + CYCLE.length) % CYCLE.length;
    }

    function getShift(date) {
      return CYCLE[getCycleIndex(date)];
    }

    // ===== 班次时间计算 (白班 8:00-20:00 / 夜班 20:00-次日8:00) =====
    function getShiftTimes(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const day = date.getDate();

      // 白班：当日 8:00 - 20:00
      const dayStart = new Date(year, month, day, 8, 0, 0);
      const dayEnd = new Date(year, month, day, 20, 0, 0);

      // 夜班：当日 20:00 - 次日 8:00
      const nightStart = new Date(year, month, day, 20, 0, 0);
      const nightEnd = new Date(year, month, day + 1, 8, 0, 0);

      const shift = getShift(date);

      if (shift === '白班') {
        return { start: dayStart, end: dayEnd };
      } else if (shift === '夜班') {
        return { start: nightStart, end: nightEnd };
      } else {
        return null; // 休息
      }
    }

    // 获取当前有效班次（考虑跨日夜班：夜班 20:00→次日 08:00）
    function getEffectiveShiftInfo() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      const yesterdayShift = getShift(yesterday);
      const today8am = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 8, 0, 0);

      // 如果现在是 08:00 之前，且昨天是夜班，则仍在昨天的夜班中
      if (now < today8am && yesterdayShift === '夜班') {
        const nightStart = new Date(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate(), 20, 0, 0);
        const nightEnd = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 8, 0, 0);
        return {
          shift: '夜班',
          isCrossDay: true,
          start: nightStart,
          end: nightEnd
        };
      }

      const todayShift = getShift(today);
      const times = getShiftTimes(today);
      return {
        shift: todayShift,
        isCrossDay: false,
        start: times ? times.start : null,
        end: times ? times.end : null
      };
    }

    // 格式化倒计时 (毫秒 → HH:MM:SS)
    function formatCountdown(ms) {
      if (ms <= 0) return '00:00:00';
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // 计算距离下一个班次上班的时间（用于休息日）
    function getNextWorkCountdown(now) {
      for (let i = 0; i < 14; i++) {
        const checkDate = new Date(now);
        checkDate.setDate(checkDate.getDate() + i);
        const shift = getShift(checkDate);
        if (shift !== '休息') {
          const times = getShiftTimes(checkDate);
          if (times && times.start > now) {
            return times.start - now;
          }
        }
      }
      return null;
    }

    // 计算距离最近的休息日还有几天
    function getDaysToNextRest() {
      const today = new Date();
      today.setHours(0,0,0,0);
      for (let i = 0; i <= 14; i++) {
        const checkDate = new Date(today);
        checkDate.setDate(checkDate.getDate() + i);
        if (getShift(checkDate) === '休息') {
          return i;
        }
      }
      return -1;
    }

    // 更新实时时钟和倒计时
    function updateLiveClockAndCountdown() {
    try {
      const now = new Date();

      // 1. 实时时钟
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      document.getElementById('liveClock').textContent = timeStr;

      // 2. 获取有效班次信息（考虑跨日夜班）
      const info = getEffectiveShiftInfo();
      const shift = info.shift;

      const workEl = document.getElementById('countdownToWork');
      const offEl = document.getElementById('countdownToOff');

      if (shift === '休息') {
        // 今日休息，显示距离下次上班的倒计时
        const nextWorkMs = getNextWorkCountdown(now);
        if (nextWorkMs !== null) {
          workEl.textContent = formatCountdown(nextWorkMs);
        } else {
          workEl.textContent = '--:--:--';
        }
        offEl.textContent = '今日休息';
        offEl.style.fontSize = '13px';
        offEl.style.fontWeight = '400';
      } else {
        const start = info.start;
        const end = info.end;

        if (now < start) {
          // 还没上班：距离上班倒计时
          workEl.textContent = formatCountdown(start - now);
          offEl.textContent = formatCountdown(end - now);
        } else if (now < end) {
          // 上班中：距离下班倒计时
          workEl.textContent = '已上班';
          offEl.textContent = formatCountdown(end - now);
        } else {
          // 已下班：显示距离下次上班的倒计时（类似休息日逻辑）
          workEl.textContent = '已下班';
          offEl.textContent = '已下班';
          const nextWorkMs = getNextWorkCountdown(now);
          if (nextWorkMs !== null) {
            workEl.textContent = formatCountdown(nextWorkMs);
          }
        }

        offEl.style.fontSize = '';
        offEl.style.fontWeight = '';
      }

      // 3. 检测跨日夜班状态变化，动态更新今日班次卡片显示
      updateTodayCardDisplay(info);
    } catch(e) { /* 静默捕获，确保 setInterval 不中断 */ }
    }

    // 动态更新今日班次卡片的班次显示（处理跨日夜班 8:00 切换）
    let lastEffectiveShift = null;
    function updateTodayCardDisplay(info) {
      const shiftKey = info.shift + (info.isCrossDay ? '_crossday' : '');
      if (shiftKey === lastEffectiveShift) return; // 无变化则跳过
      lastEffectiveShift = shiftKey;

      const shiftMap = { '白班': ['day','☀️'], '夜班': ['night','🌙'], '休息': ['rest','🏖️'] };
      const [cls, emoji] = shiftMap[info.shift] || ['rest', '❓'];
      const td = document.getElementById('todayShift');
      td.innerHTML = `<span class="today-shift-emoji">${emoji}</span>${info.shift}`;
      td.className = `today-shift ${cls}`;

      // 更新背景色
      const shiftClass = info.shift === '白班' ? 'day' : info.shift === '夜班' ? 'night' : 'rest';
      document.body.setAttribute('data-shift', shiftClass);
    }

    function getWeekdayCn(date) {
      return ['周日','周一','周二','周三','周四','周五','周六'][date.getDay()];
    }

    function formatDate(date) {
      return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`;
    }

    function formatDateISO(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function isSameDay(a, b) {
      return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }

    function isToday(date) {
      return isSameDay(date, new Date());
    }

    function isPast(date) {
      const today = new Date();
      today.setHours(0,0,0,0);
      return date < today;
    }

    // Calculate next shifts
    function calculateNextShifts() {
      const today = new Date();
      today.setHours(0,0,0,0);

      let nextDayDays = -1;
      let nextNightDays = -1;

      for (let i = 1; i <= 30; i++) {
        const futureDate = new Date(today);
        futureDate.setDate(futureDate.getDate() + i);

        if (nextDayDays === -1 && getShift(futureDate) === '白班') {
          nextDayDays = i;
        }

        if (nextNightDays === -1 && getShift(futureDate) === '夜班') {
          nextNightDays = i;
        }

        if (nextDayDays !== -1 && nextNightDays !== -1) break;
      }

      return { nextDay: nextDayDays, nextNight: nextNightDays };
    }

    // Calculate monthly statistics
    function calculateMonthlyStats(year, month) {
      let dayCount = 0;
      let nightCount = 0;
      let restCount = 0;

      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(year, month, d);
        const shift = getShift(date);

        if (shift === '白班') dayCount++;
        else if (shift === '夜班') nightCount++;
        else if (shift === '休息') restCount++;
      }

      return { dayCount, nightCount, restCount };
    }

    // 计算连续相同班次天数
    function getConsecutiveShiftDays(date) {
      const shift = getShift(date);
      let count = 1;

      // 向前数
      for (let i = 1; i <= 60; i++) {
        const prev = new Date(date);
        prev.setDate(prev.getDate() - i);
        if (getShift(prev) === shift) count++;
        else break;
      }

      return count;
    }

    // 计算某日距离周末(下一个休息日)的天数
    function getDaysToWeekend(date) {
      for (let i = 0; i <= 14; i++) {
        const check = new Date(date);
        check.setDate(check.getDate() + i);
        if (getShift(check) === '休息') return i;
      }
      return -1;
    }

    // 计算某月总工时
    function calculateWorkHours(year, month) {
      const stats = calculateMonthlyStats(year, month);
      return (stats.dayCount + stats.nightCount) * 12;
    }

    // Update background based on today's shift (考虑跨日夜班)
    function updateBackgroundShift() {
      const info = getEffectiveShiftInfo();
      const shiftClass = info.shift === '白班' ? 'day' : info.shift === '夜班' ? 'night' : 'rest';
      document.body.setAttribute('data-shift', shiftClass);
    }

    // 计算上月统计（用于趋势对比）
    function getPrevMonthStats() {
      let prevYear = viewYear;
      let prevMonth = viewMonth - 1;
      if (prevMonth < 0) { prevMonth = 11; prevYear--; }
      return calculateMonthlyStats(prevYear, prevMonth);
    }

    // 趋势文本
    function getTrendText(current, previous) {
      if (current > previous) return { text: `↑ +${current - previous}`, cls: 'up' };
      if (current < previous) return { text: `↓ ${current - previous}`, cls: 'down' };
      return { text: '— 持平', cls: 'same' };
    }

    // ===== Render =====
    function render() {
      const today = new Date();
      updateBackgroundShift();

      // Subtitle
      document.getElementById('subtitle').textContent =
        `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日 ${getWeekdayCn(today)}`;

      // Today card
      let todayDateInfo = formatDate(today) + ' ' + getWeekdayCn(today);

      // 添加农历信息
      const lunar = getLunarDate(today);
      todayDateInfo += ` 农历${lunar.monthStr}${lunar.dayStr}`;

      // 添加节气信息
      const solarTerm = getSolarTerm(today);
      if (solarTerm) {
        const termInfo = SOLAR_TERM_INFO[solarTerm];
        todayDateInfo += ` ${termInfo.icon}${solarTerm}`;
      }

      // 添加节假日信息
      const holiday = getHoliday(today);
      if (holiday) {
        todayDateInfo += ` 🎉${holiday}`;
      }

      document.getElementById('todayDate').textContent = todayDateInfo;
      // 使用有效班次（考虑跨日夜班）
      const effectiveInfo = getEffectiveShiftInfo();
      const shift = effectiveInfo.shift;
      const shiftMap = { '白班': ['day','☀️'], '夜班': ['night','🌙'], '休息': ['rest','🏖️'] };
      const [cls, emoji] = shiftMap[shift] || ['rest', '❓'];
      const td = document.getElementById('todayShift');
      td.innerHTML = `<span class="today-shift-emoji">${emoji}</span>${shift}`;
      td.className = `today-shift ${cls}`;
      document.getElementById('todayCycle').textContent = getCycleIndex(today) + 1;

      // Progress bar
      const progress = (getCycleIndex(today) + 1) / CYCLE.length * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;

      // Next shift info
      const nextShifts = calculateNextShifts();
      document.getElementById('nextDayInfo').textContent = nextShifts.nextDay === -1 ? 'N/A' : `${nextShifts.nextDay}天`;
      document.getElementById('nextNightInfo').textContent = nextShifts.nextNight === -1 ? 'N/A' : `${nextShifts.nextNight}天`;

      // Rest countdown
      const restDays = getDaysToNextRest();
      document.getElementById('restCountdown').textContent = restDays === 0 ? '今天!' : restDays > 0 ? `${restDays}天` : 'N/A';

      // Monthly statistics
      const stats = calculateMonthlyStats(viewYear, viewMonth);
      const prevStats = getPrevMonthStats();
      document.getElementById('dayCount').textContent = stats.dayCount;
      document.getElementById('nightCount').textContent = stats.nightCount;
      document.getElementById('restCount').textContent = stats.restCount;

      // Trends
      const dayTrend = getTrendText(stats.dayCount, prevStats.dayCount);
      const nightTrend = getTrendText(stats.nightCount, prevStats.nightCount);
      const restTrend = getTrendText(stats.restCount, prevStats.restCount);
      document.getElementById('dayTrend').textContent = dayTrend.text;
      document.getElementById('dayTrend').className = `stat-trend ${dayTrend.cls}`;
      document.getElementById('nightTrend').textContent = nightTrend.text;
      document.getElementById('nightTrend').className = `stat-trend ${nightTrend.cls}`;
      document.getElementById('restTrend').textContent = restTrend.text;
      document.getElementById('restTrend').className = `stat-trend ${restTrend.cls}`;

      // Work hours
      const workHours = calculateWorkHours(viewYear, viewMonth);
      document.getElementById('workHours').textContent = workHours;

      // Ring chart
      const totalDays = stats.dayCount + stats.nightCount + stats.restCount;
      const dayPct = totalDays > 0 ? (stats.dayCount / totalDays * 100) : 0;
      const nightPct = totalDays > 0 ? (stats.nightCount / totalDays * 100) : 0;
      const restPct = totalDays > 0 ? (stats.restCount / totalDays * 100) : 0;
      const workPct = totalDays > 0 ? ((stats.dayCount + stats.nightCount) / totalDays * 100) : 0;
      document.getElementById('ringChart').style.background = `conic-gradient(
        var(--day-color) 0% ${dayPct}%,
        var(--night-color) ${dayPct}% ${dayPct + nightPct}%,
        var(--rest-color) ${dayPct + nightPct}% 100%
      )`;
      document.getElementById('ringChartInner').textContent = `${Math.round(workPct)}%`;
      document.getElementById('ringDay').textContent = `白班 ${stats.dayCount}天`;
      document.getElementById('ringNight').textContent = `夜班 ${stats.nightCount}天`;
      document.getElementById('ringRest').textContent = `休息 ${stats.restCount}天`;

      // Month title
      document.getElementById('monthTitle').textContent = `${viewYear}年${viewMonth+1}月`;

      // Nav buttons
      const today2 = new Date();
      const minYear = today2.getFullYear() - 1;
      const maxYear = today2.getFullYear() + 1;
      document.getElementById('prevBtn').disabled = (viewYear === minYear && viewMonth === 0);
      document.getElementById('nextBtn').disabled = (viewYear === maxYear && viewMonth === 11);

      // Calendar
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      const firstDay = new Date(viewYear, viewMonth, 1);
      const startDow = (firstDay.getDay() + 6) % 7; // Monday=0
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

      // Determine current week row for highlighting
      const todayOfWeek = today.getDay();
      const todayMonday = new Date(today);
      todayMonday.setDate(today.getDate() - ((todayOfWeek + 6) % 7));
      const todaySunday = new Date(todayMonday);
      todaySunday.setDate(todayMonday.getDate() + 6);

      // Empty cells before
      for (let i = 0; i < startDow; i++) {
        grid.appendChild(mk('div', { cls: 'day-cell empty' }));
      }

      // Day cells with stagger animation
      let cellIndex = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(viewYear, viewMonth, d);
        const s = getShift(date);
        const shiftCls = { '白班': 'shift-day', '夜班': 'shift-night', '休息': 'shift-rest' }[s] || 'shift-rest';
        const dotCls = { '白班': 'day', '夜班': 'night', '休息': 'rest' }[s] || 'rest';
        const past = isPast(date) && !isToday(date);
        const todayCls = isToday(date) ? ' today' : '';
        const pastCls = past ? ' past' : '';

        // Current week highlight
        let weekCls = '';
        if (date >= todayMonday && date <= todaySunday && viewMonth === today.getMonth() && viewYear === today.getFullYear()) {
          weekCls = ' current-week';
        }

        const cell = mk('div', {
          cls: `day-cell ${shiftCls}${todayCls}${pastCls}${weekCls} animate-in`,
          onclick: () => showDetail(date)
        });
        // 标记当前选中日期
        if (selectedDate && isSameDay(date, selectedDate)) {
          cell.classList.add('selected');
        }
        cell.style.animationDelay = `${cellIndex * 20}ms`;

        // Tooltip
        const shiftName = s;
        const tooltip = mk('div', { cls: 'cell-tooltip', text: shiftName });
        cell.appendChild(tooltip);

        // Add holiday badge if exists
        const holiday = getHoliday(date);
        if (holiday) {
          const holidayBadge = mk('div', { cls: 'holiday-badge', text: holiday.substring(0, 2) });
          cell.appendChild(holidayBadge);
        }

        const dot = mk('div', { cls: `shift-dot ${dotCls}` });
        const num = mk('div', { cls: 'day-num', text: d });

        // Add lunar date
        const lunar = getLunarDate(date);
        const solarTerm = getSolarTerm(date);

        let lunarText = '';
        let lunarClass = 'lunar-date';

        if (solarTerm) {
          const termInfo = SOLAR_TERM_INFO[solarTerm];
          lunarText = `${termInfo.icon}${solarTerm}`;
          lunarClass = 'lunar-date solar-term';
        } else if (lunar.day === 1) {
          lunarText = lunar.monthStr;
        } else {
          lunarText = lunar.dayStr;
        }

        const lunarEl = mk('div', { cls: lunarClass, text: lunarText });

        cell.appendChild(dot);
        cell.appendChild(num);
        cell.appendChild(lunarEl);
        grid.appendChild(cell);

        cellIndex++;
      }

      // Render heatmap
      renderHeatmap();

      // 每次渲染后刷新一次倒计时（保证切换月份后依然准确）
      updateLiveClockAndCountdown();
    }

    // ===== Year Heatmap (Mini Calendars) =====
    function renderHeatmap() {
      const grid = document.getElementById('heatmapGrid');
      grid.innerHTML = '';
      const today = new Date();
      const weekdays = ['一','二','三','四','五','六','日'];

      for (let m = 0; m < 12; m++) {
        const isCurrent = (viewYear === today.getFullYear() && m === today.getMonth());
        const daysInMonth = new Date(viewYear, m + 1, 0).getDate();
        const firstDow = (new Date(viewYear, m, 1).getDay() + 6) % 7; // Mon=0

        const monthDiv = mk('div', { cls: 'heatmap-month' + (isCurrent ? ' current-month' : '') });

        // Weekday headers
        const wdRow = mk('div', { cls: 'mini-cal-weekdays' });
        for (let w = 0; w < 7; w++) {
          const wd = mk('div', { cls: 'mini-cal-wd', text: weekdays[w] });
          wdRow.appendChild(wd);
        }
        monthDiv.appendChild(wdRow);

        // Day grid
        const calGrid = mk('div', { cls: 'mini-cal-grid' });

        // Empty cells before first day
        for (let i = 0; i < firstDow; i++) {
          calGrid.appendChild(mk('div', { cls: 'mini-cal-day empty' }));
        }

        // Day cells
        for (let d = 1; d <= daysInMonth; d++) {
          const date = new Date(viewYear, m, d);
          const shift = getShift(date);
          const shiftCls = { '白班': 'shift-day', '夜班': 'shift-night', '休息': 'shift-rest' }[shift] || 'shift-rest';
          const isTodayCell = isToday(date);
          const isSelectedCell = selectedDate && isSameDay(date, selectedDate);
          const dayEl = mk('div', {
            cls: 'mini-cal-day ' + shiftCls + (isTodayCell ? ' today-marker' : '') + (isSelectedCell ? ' selected-day' : '')
          });
          dayEl.title = `${m+1}月${d}日 · ${shift}`;
          // 点击迷你日历日期 → 跳转月份 + 展示详情面板
          dayEl.style.cursor = 'pointer';
          dayEl.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedDate = date;
            viewMonth = m;
            render();
            showDetail(date);
          });
          calGrid.appendChild(dayEl);
        }

        monthDiv.appendChild(calGrid);

        // Month label
        const label = mk('div', { cls: 'heatmap-month-label', text: `${m+1}月` });
        monthDiv.appendChild(label);

        // Click to navigate
        monthDiv.addEventListener('click', () => {
          viewMonth = m;
          closeDetail();
          render();
        });

        grid.appendChild(monthDiv);
      }
    }

    function mk(tag, opts) {
      const el = document.createElement(tag);
      if (opts.cls) el.className = opts.cls;
      if (opts.text) el.textContent = opts.text;
      if (opts.onclick) el.onclick = opts.onclick;
      if (opts.html) el.innerHTML = opts.html;
      return el;
    }

    // ===== Detail Panel =====
    function showDetail(date) {
      const s = getShift(date);
      const cls = { '白班': 'day', '夜班': 'night', '休息': 'rest' }[s] || 'rest';
      const emoji = { '白班': '☀️', '夜班': '🌙', '休息': '🏖️' }[s] || '❓';
      const panel = document.getElementById('detailPanel');

      // 构建日期信息
      let dateInfo = formatDate(date) + ' ' + getWeekdayCn(date);

      // 添加农历信息
      const lunar = getLunarDate(date);
      dateInfo += ` 农历${lunar.yearGanZhi}年[${lunar.zodiac}]${lunar.monthStr}${lunar.dayStr}`;

      // 添加节气信息
      const solarTerm = getSolarTerm(date);
      if (solarTerm) {
        const termInfo = SOLAR_TERM_INFO[solarTerm];
        dateInfo += ` ${termInfo.icon}${solarTerm}`;
      }

      // 添加节假日信息
      const holiday = getHoliday(date);
      if (holiday) {
        dateInfo += ` 🎉${holiday}`;
      }

      document.getElementById('detailDate').textContent = dateInfo;
      const ds = document.getElementById('detailShift');
      ds.innerHTML = `${emoji} ${s}`;
      ds.className = `detail-shift ${cls}`;
      document.getElementById('detailCycle').textContent = getCycleIndex(date) + 1;

      // 增强详情信息
      const extraEl = document.getElementById('detailExtra');
      extraEl.innerHTML = '';

      // 连续班次天数
      const consecutive = getConsecutiveShiftDays(date);
      extraEl.appendChild(mkDetailItem('连续同班', `${consecutive}天`));

      // 本月累计工时
      const workHrs = calculateWorkHours(date.getFullYear(), date.getMonth());
      extraEl.appendChild(mkDetailItem('本月工时', `${workHrs}h`));

      // 距离周末/休息日
      const daysToRest = getDaysToWeekend(date);
      extraEl.appendChild(mkDetailItem('距休息日', daysToRest === 0 ? '今天' : `${daysToRest}天`));

      // 周期位置
      const cyclePos = getCycleIndex(date) + 1;
      extraEl.appendChild(mkDetailItem('周期位置', `${cyclePos}/${CYCLE.length}`));

      panel.classList.add('show');
      // 在宽屏模式下，详情面板会固定在左侧栏，不需要滚动
      if (window.innerWidth < 769) {
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      selectedDate = date;
      // 更新日历格子的选中标记
      document.querySelectorAll('.day-cell.selected').forEach(el => el.classList.remove('selected'));
      document.querySelectorAll('.day-cell').forEach(el => {
        const numEl = el.querySelector('.day-num');
        if (numEl && !el.classList.contains('empty')) {
          const day = parseInt(numEl.textContent);
          if (day === date.getDate() && viewMonth === date.getMonth() && viewYear === date.getFullYear()) {
            el.classList.add('selected');
          }
        }
      });
      // 同步更新小日历的选中标记
      renderHeatmap();
    }

    function mkDetailItem(label, value) {
      const div = mk('div', { cls: 'detail-extra-item' });
      const lbl = mk('div', { cls: 'detail-extra-label', text: label });
      const val = mk('div', { cls: 'detail-extra-value', text: value });
      div.appendChild(lbl);
      div.appendChild(val);
      return div;
    }

    function closeDetail() {
      document.getElementById('detailPanel').classList.remove('show');
      // 清除选中标记
      document.querySelectorAll('.day-cell.selected').forEach(el => el.classList.remove('selected'));
      selectedDate = null;
    }

    // ===== Year-Month Picker =====
    let pickerYear;
    function openPicker() {
      pickerYear = viewYear;
      renderPicker();
      document.getElementById('pickerModal').classList.add('show');
    }

    function closePicker() {
      document.getElementById('pickerModal').classList.remove('show');
    }

    function renderPicker() {
      const today = new Date();
      const minYear = today.getFullYear() - 1;
      const maxYear = today.getFullYear() + 1;

      document.getElementById('pickerYearLabel').textContent = `${pickerYear}年`;

      const monthsGrid = document.getElementById('pickerMonths');
      monthsGrid.innerHTML = '';

      for (let m = 0; m < 12; m++) {
        const btn = mk('button', { cls: 'picker-month-btn', text: `${m + 1}月` });
        if (m === viewMonth && pickerYear === viewYear) {
          btn.classList.add('active');
        }
        btn.addEventListener('click', () => {
          viewYear = pickerYear;
          viewMonth = m;
          closePicker();
          closeDetail();
          render();
        });
        monthsGrid.appendChild(btn);
      }
    }

    function pickerPrevYear() {
      const today = new Date();
      const minYear = today.getFullYear() - 1;
      if (pickerYear > minYear) {
        pickerYear--;
        renderPicker();
      }
    }

    function pickerNextYear() {
      const today = new Date();
      const maxYear = today.getFullYear() + 1;
      if (pickerYear < maxYear) {
        pickerYear++;
        renderPicker();
      }
    }

    // ===== Month Navigation =====
    function prevMonth() {
      if (viewMonth === 0) { viewYear--; viewMonth = 11; }
      else viewMonth--;
      closeDetail();
      render();
    }

    function nextMonth() {
      if (viewMonth === 11) { viewYear++; viewMonth = 0; }
      else viewMonth++;
      closeDetail();
      render();
    }

    // ===== Back to Today =====
    document.getElementById('backToToday').addEventListener('click', () => {
      const today = new Date();
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();
      closeDetail();
      render();
    });

    // ===== Keyboard Navigation =====
    document.addEventListener('keydown', (e) => {
      // Don't intercept if user is typing in an input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevMonth();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextMonth();
      } else if (e.key === 't' || e.key === 'T') {
        e.preventDefault();
        const today = new Date();
        viewYear = today.getFullYear();
        viewMonth = today.getMonth();
        closeDetail();
        render();
      } else if (e.key === 'Escape') {
        if (document.getElementById('pickerModal').classList.contains('show')) {
          closePicker();
        } else if (document.getElementById('settingsModal').classList.contains('show')) {
          closeSettings();
        } else if (document.getElementById('detailPanel').classList.contains('show')) {
          closeDetail();
        }
      }
    });

    // ===== Settings =====
    function openSettings() {
      document.getElementById('settingsModal').classList.add('show');
      document.getElementById('anchorDate').value = formatDateISO(ANCHOR_DATE);
      document.getElementById('cyclePattern').value = CYCLE.join(' ');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('show');
    }

    function saveSettings() {
      const anchorVal = document.getElementById('anchorDate').value;
      const newCycle = document.getElementById('cyclePattern').value.split(/\s+/).filter(s => s.trim() !== '');

      if (newCycle.length === 0) {
        alert('周期模式不能为空！');
        return;
      }

      // 校验日期输入
      if (!anchorVal) {
        alert('请选择锚定日期！');
        return;
      }
      const parts = anchorVal.split('-');
      if (parts.length !== 3 || isNaN(parts[0]) || isNaN(parts[1]) || isNaN(parts[2])) {
        alert('日期格式无效！');
        return;
      }
      const newAnchor = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      if (isNaN(newAnchor.getTime())) {
        alert('无效的日期！');
        return;
      }

      ANCHOR_DATE = newAnchor;
      CYCLE = newCycle;

      localStorage.setItem('qingzheng-anchor', anchorVal);
      localStorage.setItem('qingzheng-cycle', JSON.stringify(CYCLE));

      // 同步到原生存储
      if (typeof Android !== 'undefined') {
        Android.saveSettings(JSON.stringify(CYCLE), anchorVal);
      }

      closeSettings();
      render();
    }

    // ===== 窗口大小变化时重新渲染 =====
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        render();
      }, 250);
    });
  </script>
</body>
</html>
